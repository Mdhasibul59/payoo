<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money</title>
    <!-- daisy UI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-[#f4f5f7] max-w-lg mx-auto">
    <section class="bg-white rounded-b-3xl">
        <div class="flex justify-between items-center p-3 border-b border-[#080808]/10"> <!-- bg-white -->
            <div class="flex justify-between items-center">
                <img src="./resources/assets/Group.png" alt="" class="size-12">
                <div>
                    <h1 class="font-bold text-lg">$<span>45000</span></h1>
                    <p class="text-[#080808]/50">Available Balance</p>
                </div>
            </div>
            <div>
                <button class="btn text-[#080808]/50"><i
                        class="fa-solid fa-arrow-right-from-bracket rotate-180 text-[#080808]/80"></i>Log Out</button>
            </div>
        </div>

        <div class="p-3"> <!-- bg-white -->
            <div>
                <h1 class="font-bold text-2xl">🔥 Welcome to Payooo!</h1>
                <p class="text-[#080808]/50 my-5">Enjoy easy and convenient financial services with us. Cashout charge
                    is low and</p>
            </div>
            <div class="grid grid-cols-3 gap-3 mt-3 rounded-lg">
                <div class="border  border-[#080808]/15 rounded-lg p-7 flex flex-col justify-center items-center">
                    <img src="./resources/assets/wallet1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] font-medium">Add Money</p>
                </div>
                <div class="border border-[#080808]/15 rounded-lg p-7 flex flex-col justify-center items-center">
                    <img src="./resources/assets/send1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] font-medium">Cash Out</p>
                </div>
                <div class="border border-[#080808]/15 rounded-lg  flex flex-col justify-center items-center">
                    <img src="./resources/assets/money1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] px-0 font-medium">Transfer Money</p>
                </div>
                <div class="border border-[#080808]/15 rounded-lg p-7 flex flex-col justify-center items-center">
                    <img src="./resources/assets/bonus1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] font-medium">Get Bonus</p>
                </div>
                <div class="border border-[#080808]/15 rounded-lg p-7 flex flex-col justify-center items-center">
                    <img src="./resources/assets/purse1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] font-medium">Pay Bill</p>
                </div>
                <div class="border border-[#080808]/15 rounded-lg p-7 flex flex-col justify-center items-center">
                    <img src="./resources/assets/transaction1.png" alt="">
                    <p class="text-[#080808]/60 pt-3 text-[13px] font-medium">Transactions</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Add money Section Start -->
    <section class="hidden">
        <div class="px-3 mt-10">
            <h1 class="font-semibold text-xl pl-5">Add Money</h1>
        </div>
        <div class="px-8 pb-5">
            <div class="bg-white mt-5 rounded-xl">
                <div class="p-6">
                    <div>
                        <h1 class="font-medium text-[16px] my-3">Select A Bank</h1>
                        <select class="select border-none bg-[#f4f5f7] rounded-2xl text-gray-400 w-full">
                            <option disabled selected>Select Bank</option>
                            <option>Sonali Bank</option>
                            <option>ISIB Bank</option>
                            <option>Islami Bank</option>
                        </select>
                    </div>
                    <div class="mt-3">
                        <label for="bank-account-number" class="font-medium text-[16px]">Bank Account Number</label>
                        <br>
                        <input type="text" id="bank-account-number"
                            class="input w-full rounded-2xl bg-[#F4F5F7] border-none my-3"
                            placeholder="Enter 11 digit account number" />
                    </div>
                    <div class="mt-3">
                        <label for="add-amount" class="font-medium text-[16px]">Amount to Add</label>
                        <br>
                        <input type="number" id="add-amount"
                            class="input w-full rounded-2xl bg-[#F4F5F7] border-none my-3"
                            placeholder="Add Amount to withdraw" />
                    </div>
                    <div class="mt-3">
                        <label for="pin-number" class="font-medium text-[16px]">Pin Number</label>
                        <br>
                        <input type="text" id="pin-number"
                            class="input w-full rounded-2xl bg-[#F4F5F7] border-none my-3"
                            placeholder="Enter 4 digit pin number" />
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Add Money Section End -->
</body>

</html>
